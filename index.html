<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="left">
        <img
          src="https://template.canva.com/EAHIY0CJGlw/1/0/1600w-xEZjSB00kF8.jpg"
          alt=""
          height=""
          width=""
        />
      </div>

      <div class="right">
        <h2>Hello Again !</h2>
        <p>Welcome back! we missed you!</p>
        <form action="">
          <label for="email">Email</label><br />
          <input
            type="email"
            name=""
            id="email"
            placeholder="Emailid@site.com"
          />
          <br /><br />
          <label for="password">Password</label><br />
          <input
            type="password"
            name=""
            id="password"
            placeholder="Password"
          /><br />
          <a href="" class="forgot">Forgot Password</a><br />
          <input type="button" value="Login" class="btn" /><br />
          <p class="p">
            Not a member? <a href="" class="register">Register Now</a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
